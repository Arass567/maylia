name: smart_mail_laposte
description: Application de messagerie intelligente connectée à La Poste avec analyse IA
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Email
  enough_mail: ^2.1.7

  # AI - Anthropic API
  http: ^1.2.0

  # Local Storage
  isar: 3.0.5
  isar_flutter_libs: 3.0.5
  path_provider: ^2.1.2

  # UI
  flutter_slidable: ^3.0.1
  intl: ^0.19.0
  share_plus: ^10.1.2

  # Env Variables
  flutter_dotenv: ^5.1.0

  # Security
  flutter_secure_storage: ^9.0.0

  # Utils
  cupertino_icons: ^1.0.6
  flutter_html: ^3.0.0
  flutter_widget_from_html: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  isar_generator: 3.0.5

  # App Icon Generator
  flutter_launcher_icons: ^0.13.1
  


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E8E8E8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
