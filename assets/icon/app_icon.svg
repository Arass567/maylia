<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gray background rounded rectangle for the icon base -->
  <rect x="0" y="0" width="100" height="100" rx="12" fill="#E8E8E8"/>

  <!-- Yellow bottom part of the envelope -->
  <path d="M0 60 L0 88 C0 94.6274 5.37258 100 12 100 L88 100 C94.6274 100 100 94.6274 100 88 L100 60 L50 78 L0 60 Z" fill="#FFC107"/>

  <!-- White top opening of the envelope -->
