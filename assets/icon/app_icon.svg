  <!-- Yellow body of the bird -->
  <path d="M30 35 C30 25 40 20 50 20 C60 20 70 25 70 35 C70 40 65 45 60 50 C55 55 45 55 35 50 C25 45 25 40 30 35 Z" fill="#FFC107"/>

  <!-- Orange wing and belly of the bird -->
  <path d="M35 45 C38 50 45 55 55 55 C60 55 65 50 65 45 C60 40 50 35 40 40 Z" fill="#F97316"/>

  <!-- Orange beak of the bird -->
  <path d="M70 30 L78 33 L70 36 Z" fill="#F97316"/>

  <!-- Outer black part of the bird's eye -->
