name: Scout Education Mayotte v2
on:
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Run scout
        run: |
          python3 - <<'PYEOF'
import urllib.request
import urllib.error
import ssl
import re
import json

ctx = ssl.create_default_context()
ctx.check_hostname = False
ctx.verify_mode = ssl.CERT_NONE

def fetch(url, timeout=15):
    req = urllib.request.Request(url, headers={
        'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
        'Accept': 'text/html,application/xhtml+xml,*/*',
        'Accept-Language': 'fr-FR,fr;q=0.9',
    })
    try:
        with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
            return r.status, r.read(65536).decode('utf-8', errors='replace'), r.headers.get('content-type','')
    except urllib.error.HTTPError as e:
        return e.code, '', ''
    except Exception as e:
        return 0, '', str(e)

def fetch_img(url, timeout=10):
    req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
    try:
        with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
            ct = r.headers.get('content-type','')
            data = r.read(200000)
            return r.status, ct, len(data)
    except urllib.error.HTTPError as e:
        return e.code, '', 0
    except Exception as e:
        return 0, '', 0

def og_image(html):
    m = re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']', html, re.I)
    if not m:
        m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']', html, re.I)
    return m.group(1).strip() if m else None

def page_title(html):
    m = re.search(r'<title[^>]*>([^<]+)</title>', html, re.I)
    return m.group(1).strip() if m else None

candidates = [
    # ac-mayotte.fr
    {
        "url": "https://www.ac-mayotte.fr/le-systeme-educatif-a-mayotte",
        "type": "article", "sourceName": "Académie de Mayotte", "sourceDomain": "ac-mayotte.fr"
    },
    {
        "url": "https://www.ac-mayotte.fr/les-langues-regionales-a-mayotte",
        "type": "article", "sourceName": "Académie de Mayotte", "sourceDomain": "ac-mayotte.fr"
    },
    # lumni.fr
    {
        "url": "https://www.lumni.fr/video/l-ecole-a-mayotte",
        "type": "documentary", "sourceName": "Lumni", "sourceDomain": "lumni.fr"
    },
    {
        "url": "https://www.lumni.fr/article/mayotte-un-territoire-en-quete-d-education",
        "type": "article", "sourceName": "Lumni", "sourceDomain": "lumni.fr"
    },
    # ina.fr
    {
        "url": "https://www.ina.fr/ina-eclaire-actu/mayotte-l-ecole-une-priorite",
        "type": "archive", "sourceName": "INA", "sourceDomain": "ina.fr"
    },
    {
        "url": "https://www.ina.fr/ina-eclaire-actu/education-a-mayotte",
        "type": "archive", "sourceName": "INA", "sourceDomain": "ina.fr"
    },
    # france culture
    {
        "url": "https://www.radiofrance.fr/franceculture/podcasts/series/mayotte-l-ecole-impossible",
        "type": "podcast", "sourceName": "France Culture", "sourceDomain": "radiofrance.fr"
    },
    # culture.gouv.fr
    {
        "url": "https://www.culture.gouv.fr/Regions/Dac-Mayotte/Actualites/Enseignement-artistique-a-Mayotte",
        "type": "article", "sourceName": "DAC Mayotte - culture.gouv.fr", "sourceDomain": "culture.gouv.fr"
    },
]

results = []
for c in candidates:
    url = c['url']
    print(f"\n--- {url} ---")
    status, html, ct = fetch(url)
    print(f"  HTTP {status} | content-type: {ct[:60]}")
    if status != 200:
        c['httpStatus'] = status
        c['rejected_reason'] = f"HTTP {status}"
        results.append(c)
        continue
    title = page_title(html)
    img_url = og_image(html)
    print(f"  title: {title}")
    print(f"  og:image: {img_url}")
    img_status, img_ct, img_size = 0, '', 0
    if img_url:
        img_status, img_ct, img_size = fetch_img(img_url)
        print(f"  img HTTP {img_status} | {img_ct} | {img_size} bytes")
    c['httpStatus'] = status
    c['title'] = title
    c['thumbnailUrl'] = img_url
    c['imgStatus'] = img_status
    c['imgContentType'] = img_ct
    c['thumbnailSizeKb'] = round(img_size / 1024, 1)
    results.append(c)

print("\n\n=== JSON RESULTS ===")
print(json.dumps(results, ensure_ascii=False, indent=2))
PYEOF
